services:
  - type: web
    name: trustwork-api
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: APP_ENVIRONMENT
        value: production
      - key: PORT
        value: "8000"
      - key: CHAIN_ID
        value: "84532"
      - key: USDC_CONTRACT_ADDRESS
        value: "0x036CbD53842c5426634e7929541eC2318f3dCF7e"
      - key: RPC_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ESCROW_CONTRACT_ADDRESS
        value: "0xCB9A7C320a46fa8FA091C7E74DD192df2fb6Ce81"
      - key: ESCROW_ARBITRATOR
        value: "0x407B1Ed9dE0DcE663c08879cC47F10dae0E3f470"
      - key: INDEXER_START_BLOCK
        value: "45824805"
      - key: JWT_SECRET
        generateValue: true
      - key: INDEXER_TOKEN
        generateValue: true
      - key: API_CORS_ORIGINS
        value: "https://temporary-prompt-zircon-x65kb5y.vercel.app"
      - key: SIWE_DOMAIN
        value: "temporary-prompt-zircon-x65kb5y.vercel.app"
      - key: SIWE_ORIGIN
        value: "https://temporary-prompt-zircon-x65kb5y.vercel.app"
      - key: TRUSTED_HOSTS
        value: "trustwork-api.onrender.com"
