name: Bug report
description: Report a reproducible TrustWork defect
body:
  - type: markdown
    attributes:
      value: Do not include secrets, wallet credentials, or private evidence content.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, wallet, and environment
