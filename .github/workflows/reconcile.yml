name: Reconcile Base Sepolia events

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    name: Reconcile indexed events
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PORTFOLIO_DEPLOYED: ${{ vars.PORTFOLIO_DEPLOYED }}
      TRUSTWORK_API_URL: ${{ secrets.TRUSTWORK_API_URL }}
      INDEXER_TOKEN: ${{ secrets.INDEXER_TOKEN }}
    steps:
      - name: Report an unconfigured portfolio deployment
        if: ${{ env.PORTFOLIO_DEPLOYED != 'true' }}
        run: |
          echo "::notice title=Reconciliation skipped::PORTFOLIO_DEPLOYED is not true because the public API has not passed its live smoke test."

      - name: Require deployment secrets after launch
        if: ${{ env.PORTFOLIO_DEPLOYED == 'true' && (env.TRUSTWORK_API_URL == '' || env.INDEXER_TOKEN == '') }}
        run: |
          echo "::error title=Deployment secrets missing::PORTFOLIO_DEPLOYED is true, but TRUSTWORK_API_URL or INDEXER_TOKEN is not configured."
          exit 1

      - name: Reconcile confirmed escrow events
        if: ${{ env.PORTFOLIO_DEPLOYED == 'true' && env.TRUSTWORK_API_URL != '' && env.INDEXER_TOKEN != '' }}
        run: |
          curl --fail-with-body --retry 4 --retry-all-errors \
            --max-time 45 \
            --request POST \
            --header "X-Indexer-Token: $INDEXER_TOKEN" \
            "$TRUSTWORK_API_URL/indexer/reconcile"
