name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: freelance_escrow
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/freelance_escrow
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
      - uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0
        with:
          version: "0.11.26"
          enable-cache: true
      - run: uv sync --extra dev --locked
      - run: uv run ruff check app tests
      - run: uv run pytest
      - run: uv run pip-audit

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Validate production bundle without demo fixtures
        env:
          VITE_API_BASE_URL: https://api.trustwork.example
          VITE_CHAIN_ID: "8453"
          VITE_ESCROW_CONTRACT_ADDRESS: "0x0000000000000000000000000000000000000001"
          VITE_USDC_CONTRACT_ADDRESS: "0x0000000000000000000000000000000000000002"
          VITE_WALLETCONNECT_PROJECT_ID: ci-production-check
          VITE_ENABLE_DEMO_DATA: "false"
        run: |
          npm run build:production
          ! grep -R -E "Northstar Labs|Checkout USDC para SaaS" dist

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1
      - uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0
        with:
          version: "0.11.26"
          enable-cache: true
      - run: forge fmt --check
      - run: forge test
      - run: uvx --from slither-analyzer==0.11.5 slither . --exclude-dependencies --fail-high

  schema-contract:
    name: API schema contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0
        with:
          version: "0.11.26"
          enable-cache: true
      - run: uv sync --project backend --extra dev --locked
      - run: npm ci --prefix frontend
      - run: ./scripts/generate-api-schema.sh
      - run: git diff --exit-code -- backend/openapi.json frontend/src/lib/api.generated.ts

  sbom:
    name: Release manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0
        with:
          version: "0.11.26"
      - run: npm ci --prefix frontend
      - run: ./scripts/sbom.sh artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: software-bill-of-materials
          path: artifacts/

  security-scan:
    name: Dependencies, IaC, secrets and images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          submodules: true
      - name: Scan repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: CRITICAL,HIGH
          version: v0.70.0
      - name: Build backend image
        run: docker build --tag trustwork-backend:ci ./backend
      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: trustwork-backend:ci
          scanners: vuln
          vuln-type: os,library
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: CRITICAL,HIGH
          version: v0.70.0
      - name: Scan PostgreSQL image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
          scanners: vuln
          vuln-type: os
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: CRITICAL,HIGH
          version: v0.70.0
      - name: Scan Redis image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
          scanners: vuln
          vuln-type: os
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: CRITICAL,HIGH
          version: v0.70.0
