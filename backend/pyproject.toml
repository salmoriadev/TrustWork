[project]
name = "trustwork-api"
version = "0.1.0"
description = "FastAPI API and Base Sepolia event indexer for the TrustWork escrow portfolio demo."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14.0",
    "fastapi>=0.115.0",
    "pyjwt>=2.10.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.35",
    "tenacity>=9.0.0",
    "uvicorn>=0.32.0",
    "web3>=7.4.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=0.28.0",
    "pip-audit>=2.9.0",
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
